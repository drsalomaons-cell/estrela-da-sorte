name: Build pacote web Estrela da Sorte

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-package
  cancel-in-progress: true

jobs:
  web-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: estrela-da-sorte-web
          path: dist/
