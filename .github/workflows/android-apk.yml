name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run ci
      - run: npx cap add android
      - name: Set Android app label and launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="@string/app_name"','android:label="Estrela da Sorte"')
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_launcher"')
          p.write_text(s)
          q=Path('android/app/src/main/res/drawable/ic_launcher.xml')
          q.write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="512dp" android:height="512dp" android:viewportWidth="512" android:viewportHeight="512"><path android:fillColor="#080B24" android:pathData="M110,0 L402,0 Q512,0 512,110 L512,402 Q512,512 402,512 L110,512 Q0,512 0,402 L0,110 Q0,0 110,0 Z"/><path android:fillColor="#FFD978" android:pathData="M256,70 L298,182 L418,192 L326,270 L355,387 L256,325 L157,387 L186,270 L94,192 L214,182 Z"/></vector>''')
          PY
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Estrela da Sorte</string><string name="title_activity_main">Estrela da Sorte</string></resources>
          EOF
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: estrela-da-sorte-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
