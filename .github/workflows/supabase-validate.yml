name: Estrela da Sorte - Migration validation

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-validate.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check migration files
        run: |
          test -d supabase/migrations
          ls -1 supabase/migrations
          echo "Static migration inventory completed. Remote execution requires Supabase credentials."
